<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UI reference index</title><style>:root{color-scheme:dark;--bg:#0b0d10;--panel:#12161b;--line:#28313a;--muted:#8e9aa5;--text:#eef2f4;--accent:#7dd3fc}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 ui-monospace,monospace}main{max-width:1440px;margin:auto;padding:28px 20px 70px}.top{display:flex;justify-content:space-between;gap:20px;align-items:end;border-bottom:1px solid var(--line);padding-bottom:24px}.eyebrow{color:var(--accent);letter-spacing:.12em;text-transform:uppercase;font-size:11px}.title{font:600 clamp(28px,5vw,56px)/1 system-ui;margin:8px 0;letter-spacing:-.05em}.sub{color:var(--muted);max-width:620px}.count{color:var(--muted);white-space:nowrap}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0 24px}input,.chip,button{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:6px;padding:10px 12px;font:inherit}input{min-width:230px;flex:1}.chip,button{cursor:pointer}.chip.active,.chip:hover,button:hover{border-color:var(--accent);color:var(--accent)}#chips{display:flex;gap:8px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden}.preview{aspect-ratio:4/3;background:#080a0c;display:grid;place-items:center;overflow:hidden}.preview img,.preview video{width:100%;height:100%;object-fit:cover}.preview iframe{width:100%;height:100%;border:0}.body{padding:14px}.meta{color:var(--muted);font-size:11px;display:flex;justify-content:space-between;gap:8px}.note{font:15px system-ui;margin:10px 0;min-height:44px}.tags{display:flex;gap:6px;flex-wrap:wrap}.tag{color:var(--accent);font-size:11px}.palette{display:flex;gap:5px;margin:13px 0}.swatch{width:22px;height:22px;border-radius:4px;border:1px solid #fff3}.actions{display:flex;justify-content:space-between;align-items:center;margin-top:14px}.incomplete{color:#fbbf24;font-size:11px}.empty{text-align:center;color:var(--muted);padding:50px}</style><main><header class="top"><div><div class="eyebrow">personal reference index / v1</div><h1 class="title">UI worth stealing ideas from.</h1><div class="sub">Pinterest captures, reduced to visual cues you can hand to a coding agent when the build starts.</div></div><div class="count" id="count"></div></header><section class="toolbar"><input id="search" placeholder="Search notes, tags, titles…"><div id="chips"></div></section><section class="grid" id="grid"></section><div class="empty" id="empty" hidden>No references match this filter.</div></main><script>
const state={items:[],tag:''},$=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function render(){let q=$('#search').value.toLowerCase(),a=state.items.filter(x=>(!state.tag||x.tags?.includes(state.tag))&&(!q||JSON.stringify(x).toLowerCase().includes(q)));$('#count').textContent=a.length+' / '+state.items.length+' references';$('#empty').hidden=a.length>0;$('#grid').innerHTML=a.map(x=>{let m=x.media||{},p=m.path?(m.type==='video'?'<video src="../'+m.path+'" controls preload="metadata"></video>':'<img src="../'+m.path+'" loading="lazy" alt="'+esc(x.note||x.title||'UI reference')+'">'):(m.embed_html||'<span class="incomplete">media unavailable</span>');return '<article class="card"><div class="preview">'+p+'</div><div class="body"><div class="meta"><span>'+esc(x.title||m.type||'reference')+'</span><span>'+new Date(x.added).toLocaleDateString()+'</span></div><div class="note">'+esc(x.note||'No note added.')+'</div><div class="tags">'+(x.tags||[]).map(t=>'<span class="tag">#'+esc(t)+'</span>').join(' ')+'</div><div class="palette">'+(x.palette||[]).map(c=>'<span class="swatch" title="'+esc(c)+'" style="background:'+esc(c)+'"></span>').join('')+'</div><div class="actions">'+(x.media_incomplete?'<span class="incomplete">incomplete capture</span>':'<span></span>')+'<button data-i="'+state.items.indexOf(x)+'">Copy JSON</button></div></div></article>'}).join('')}
function chips(){let t=[...new Set(state.items.flatMap(x=>x.tags||[]))].sort();$('#chips').innerHTML=[['','all'],...t.map(x=>[x,'#'+x])].map(x=>'<button class="chip '+(state.tag===x[0]?'active':'')+'" data-tag="'+esc(x[0])+'">'+esc(x[1])+'</button>').join('')}
$('#search').oninput=render;$('#chips').onclick=e=>{let b=e.target.closest('[data-tag]');if(b){state.tag=b.dataset.tag;chips();render()}};$('#grid').onclick=async e=>{let b=e.target.closest('button');if(!b)return;await navigator.clipboard.writeText(JSON.stringify(state.items[+b.dataset.i],null,2));b.textContent='Copied';setTimeout(()=>b.textContent='Copy JSON',1200)};fetch('../data/library.json').then(r=>r.json()).then(x=>{state.items=x;chips();render()}).catch(()=>{$('#empty').hidden=false});
</script>
